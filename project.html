<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preet Pratap Singh Bhati // Project Documentation</title>
  <meta name="description" content="Detailed project documentation and architecture breakdowns for Preet Pratap Singh Bhati's AI, Computer Vision, and Embedded Systems projects.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Marked Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--bg-deep) !important;
      color: var(--text-main);
      position: relative;
      min-height: 100vh;
    }

    /* Outer Layout Wrapper for Fixed Vertical Side Labels */
    .project-doc-section {
      padding: 7rem 0 5rem 0;
      position: relative;
      z-index: 2;
    }

    .doc-layout-wrapper {
      position: relative;
      width: 100%;
    }

    /* Fixed Side Margin Labels ('DEVELOPER' Left, 'PREET' Right) */
    .side-label {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-heading);
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      font-weight: 800;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
      user-select: none;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      align-items: center;
    }

    .side-label-left {
      left: 2rem;
      writing-mode: vertical-rl;
      transform: translateY(-50%) rotate(180deg);
    }

    .side-label-right {
      right: 2rem;
      writing-mode: vertical-rl;
    }

    /* Letter-by-letter scroll reveal effect */
    .side-label span.letter {
      opacity: 0.15;
      color: var(--text-muted);
      transition: opacity 0.3s ease, color 0.3s ease, transform 0.3s ease;
      display: inline-block;
    }

    .side-label span.letter.active {
      opacity: 1;
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    /* Original Dark Obsidian Glassmorphism Container */
    .markdown-container {
      padding: 3.5rem 4.5rem;
      border-radius: 24px;
      margin-top: 1rem;
    }

    /* Original Dark Editorial Markdown Body */
    .markdown-body {
      color: var(--text-muted);
      font-family: var(--font-body);
      line-height: 1.7;
      font-size: 1.05rem;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      font-family: var(--font-heading);
      color: var(--text-main);
      font-weight: 700;
      margin-top: 2.2rem;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .markdown-body h1 {
      font-size: 2.4rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.8rem;
    }

    .markdown-body h2 {
      font-size: 1.75rem;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.5rem;
    }

    .markdown-body h3 {
      font-size: 1.3rem;
    }

    .markdown-body p {
      margin-bottom: 1.25rem;
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent);
    }

    .markdown-body a:hover {
      color: var(--accent-neon);
      border-bottom-style: solid;
    }

    .markdown-body pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 1.2rem;
      border-radius: 12px;
      overflow-x: auto;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-light);
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 1.8rem;
      margin-bottom: 1.25rem;
    }

    .markdown-body li {
      margin-bottom: 0.5rem;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      background: rgba(255, 87, 51, 0.05);
      padding: 1rem 1.5rem;
      border-radius: 0 12px 12px 0;
      color: var(--text-main);
      margin-bottom: 1.5rem;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-light);
      padding: 0.8rem 1rem;
      text-align: left;
    }

    .markdown-body th {
      background-color: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-family: var(--font-heading);
    }

    .loader-box {
      text-align: center;
      padding: 5rem 0;
      color: var(--text-main);
    }

    .spin-loader {
      font-size: 2.5rem;
      color: var(--accent);
    }

    @media (max-width: 1200px) {
      .side-label-left {
        left: 0.5rem;
      }
      .side-label-right {
        right: 0.5rem;
      }
    }

    @media (max-width: 992px) {
      .side-label {
        display: none;
      }
      .markdown-container {
        padding: 2.5rem 2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Custom Interactive Cursor Glow & Dot -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- Fixed Side Margin Labels -->
  <div class="side-label side-label-left" id="labelLeft">
    <!-- Letters injected via JS for scroll reveal -->
  </div>
  <div class="side-label side-label-right" id="labelRight">
    <!-- Letters injected via JS for scroll reveal -->
  </div>

  <!-- Ambient Glow Background -->
  <div class="glow-container">
    <div class="radial-glow glow-1"></div>
    <div class="radial-glow glow-3"></div>
  </div>

  <!-- Navigation Bar -->
  <header class="navbar scrolled">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-name">Preet Pratap Singh Bhati</span>
        <span class="brand-sep">//</span>
        <span class="brand-title">Documentation</span>
      </a>

      <div class="nav-actions">
        <a href="index.html#projects" class="btn-info-icon" aria-label="Back to Portfolio" title="Back to Portfolio" style="width: auto; padding: 0 1rem; border-radius: 100px; font-style: normal; font-size: 0.85rem; gap: 0.5rem;">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Portfolio</span>
        </a>
      </div>
    </div>
  </header>

  <main class="project-doc-section">
    <div class="container doc-layout-wrapper">
      <div id="loading" class="loader-box">
        <i class="fa-solid fa-spinner fa-spin spin-loader"></i>
        <p style="margin-top: 1rem; color: var(--text-muted); font-family: var(--font-mono);">// FETCHING_MARKDOWN_DOCUMENTATION...</p>
      </div>

      <div id="error" class="glass-panel" style="display: none; padding: 3rem; text-align: center; color: #ef4444; font-family: var(--font-mono);">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 1rem;"></i>
        <h3>// ERROR: UNABLE_TO_LOAD_DOCUMENTATION</h3>
        <p style="color: var(--text-muted); margin-top: 0.5rem;" id="errorMsg">The requested README file could not be found or fetched.</p>
        <a href="index.html#projects" class="btn-primary" style="margin-top: 1.5rem; display: inline-flex;">Return to Portfolio</a>
      </div>

      <article id="content" class="markdown-container glass-panel markdown-body" style="display: none;">
        <!-- Parsed Markdown Injected Here -->
      </article>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const fileName = urlParams.get('file');

      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const errorMsgEl = document.getElementById('errorMsg');
      const contentEl = document.getElementById('content');
      const labelLeftEl = document.getElementById('labelLeft');
      const labelRightEl = document.getElementById('labelRight');

      // Helper to build letter spans
      function setupLabelLetters(container, word) {
        container.innerHTML = '';
        word.split('').forEach(char => {
          const span = document.createElement('span');
          span.classList.add('letter');
          span.textContent = char;
          container.appendChild(span);
        });
      }

      setupLabelLetters(labelLeftEl, 'DEVELOPER');
      setupLabelLetters(labelRightEl, 'PREET');

      const leftLetters = labelLeftEl.querySelectorAll('.letter');
      const rightLetters = labelRightEl.querySelectorAll('.letter');

      // Scroll-based progressive letter-by-letter reveal
      function updateScrollLetters() {
        const scrollTop = window.scrollY;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const scrollFraction = Math.min(1, Math.max(0, scrollTop / (maxScroll || 1)));

        // Reveal left letters (DEVELOPER has 9 letters)
        const activeLeftCount = Math.floor(scrollFraction * (leftLetters.length + 1));
        leftLetters.forEach((letter, idx) => {
          if (idx < activeLeftCount) {
            letter.classList.add('active');
          } else {
            letter.classList.remove('active');
          }
        });

        // Reveal right letters (PREET has 5 letters)
        const activeRightCount = Math.floor(scrollFraction * (rightLetters.length + 1));
        rightLetters.forEach((letter, idx) => {
          if (idx < activeRightCount) {
            letter.classList.add('active');
          } else {
            letter.classList.remove('active');
          }
        });
      }

      window.addEventListener('scroll', updateScrollLetters);
      updateScrollLetters();

      if (!fileName) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorMsgEl.innerText = "// ERROR: NO_FILE_SPECIFIED";
      } else {
        fetch(fileName)
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error ${response.status}`);
            }
            return response.text();
          })
          .then(text => {
            loadingEl.style.display = 'none';
            contentEl.innerHTML = marked.parse(text);
            contentEl.style.display = 'block';
            updateScrollLetters();
          })
          .catch(err => {
            console.error('Error fetching markdown:', err);
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
            errorMsgEl.innerText = `// ERROR: UNABLE_TO_FETCH (${fileName})`;
          });
      }
    });
  </script>
</body>
</html>
